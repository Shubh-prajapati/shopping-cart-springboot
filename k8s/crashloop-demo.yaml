apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-demo
  template:
    metadata: 
      labels:
        app: crashloop-demo
    spec:
      containers:
      - name: crashloop-demo
        image: nginx
        command: ["/bin/sh"]
        args: ["-c", "exit 1"]