apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-cart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping-cart
  template:
    metadata:
      labels:
        app: shopping-cart
    spec:
      containers:
        - name: shopping-cart
          image: 679846927479.dkr.ecr.ap-south-1.amazonaws.com/shopping-cart:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: shopping-cart-service
spec:
  type: LoadBalancer
  selector:
    app: shopping-cart
  ports:
    - port: 80
      targetPort: 8080