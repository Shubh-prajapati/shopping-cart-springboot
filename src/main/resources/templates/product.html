<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
</head>
<body>
<section>

    <div class="container-fluid bg-primary py-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form action="/products" method="get" class="d-flex">
                    <input type="text" class="form-control me-2 search-input" name="ch" placeholder="Search...">

                    <button class="btn btn-light text-dark search-btn" type="submit">
                        <i class="fa-solid fa-magnifying-glass"></i> Search
                    </button>

                </form>
            </div>
        </div>
    </div>

    <!-- 🟢 Main Container (Category + Product Grid) -->
    <div class="container-fluid py-4">
        <div class="row g-3">

            <!-- Sidebar Category -->
            <div class="col-md-2">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <p class="fs-5 fw-bold mb-3">Category</p>
                        <div class="list-group list-group-flush">

                            <!-- ALL Category -->
                            <a href="/products"
                               class="list-group-item list-group-item-action"
                               th:classappend="${param.category == null} ? 'active' : ''">
                                All
                            </a>

                            <!-- Dynamic Categories -->
                            <a th:each="c : ${categories}"
                               th:href="@{'/products?category=' + ${c.name}}"
                               class="list-group-item list-group-item-action"
                               th:classappend="${param.category != null and param.category[0].trim() == c.name} ? 'active' : ''">
                                [[${c.name}]]
                            </a>

                        </div>


                    </div>
                </div>
            </div>

            <!-- Product Section -->
            <div class="col-md-10">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <p class="fs-3 fw-bold text-center mb-4">Products</p>

                        <div class="row g-4">
                            <!-- When products are available -->
                            <th:block th:if="${productsSize > 0}">
                                <div class="col-md-3 col-sm-6" th:each="p:${products}">
                                    <div class="card h-100 shadow-sm border-0">
                                        <div class="card-body text-center">
                                            <img alt="Product Image"
                                                 th:src="@{'/img/product_img/' + ${p.image}}"
                                                 class="img-fluid rounded"
                                                 style="height: 150px; object-fit: cover;">
                                            <p class="fs-5 mt-3 mb-2 text-dark fw-semibold">[[${p.title}]]</p>
                                            <p class="mb-1">
                                                <span class="fw-bold text-dark">&#8377; [[${p.discountPrice}]]</span>
                                            </p>
                                            <p class="text-secondary mb-2">
                                                <span class="text-decoration-line-through">&#8377; [[${p.price}]]</span>
                                                <span class="text-success fw-semibold">[[${p.discount}]]% off</span>
                                            </p>
                                            <a th:href="@{'/product/' + ${p.id}}"
                                               class="btn btn-outline-primary btn-sm">View Details</a>
                                        </div>
                                    </div>
                                </div>
                            </th:block>

                            <!-- When no product available -->
                            <th:block th:unless="${productsSize > 0}">
                                <p class="fs-5 text-center text-danger mt-4">No products available.</p>
                            </th:block>
                        </div>
                    </div>
                </div>

                <!-- Pagination Section -->
                <div th:if="${pageNo != null}" class="mt-4">
                    <div class="d-flex justify-content-start align-items-center mt-4">

                        <!-- Total Products (unchanged position) -->
                        <div class="me-4">
                            Total Products: [[${totalElements}]]
                        </div>

                        <!-- Pagination (slightly left aligned) -->
                        <nav aria-label="Page navigation">
                            <ul class="pagination mb-0">

                                <li class="page-item" th:classappend="${isFirst} ? 'disabled' : ''">
                                    <a class="page-link"
                                       th:href="@{'/admin/products?pageNo=' + ${pageNo - 1}}"
                                       aria-label="Previous">
                                        &laquo;
                                    </a>
                                </li>

                                <li th:each="i : ${#numbers.sequence(1, totalPages)}"
                                    class="page-item"
                                    th:classappend="${pageNo + 1 == i} ? 'active' : ''">
                                    <a class="page-link"
                                       th:href="@{'/admin/products?pageNo=' + ${i - 1} + '&pageSize=' + ${pageSize}}">[[${i}]]</a>
                                </li>

                                <li class="page-item" th:classappend="${isLast} ? 'disabled' : ''">
                                    <a class="page-link"
                                       th:href="@{'/admin/products?pageNo=' + ${pageNo + 1}}"
                                       aria-label="Next">
                                        &raquo;
                                    </a>
                                </li>

                            </ul>
                        </nav>
                    </div>
                </div>


                <!-- End Pagination -->
            </div>
        </div>
    </div>
</section>
</body>
</html>
