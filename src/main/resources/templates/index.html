<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"

<head>
    <meta charset="UTF-8">
    <title>Index Page</title>
</head>
<body>
       <section>
<!--  Start Slider-->
    <div id="carouselExample" class="carousel slide">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="img/ecom1.png" class="d-block w-100" alt="..." height="350px">
            </div>
            <div class="carousel-item">
                <img src="img/ecom3.jpg" class="d-block w-100" alt="..." height="350px">
            </div>
            <div class="carousel-item">
                <img src="img/ecom2.jpg" class="d-block w-100" alt="..." height="350px">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    <!--  End Slider-->

<!--   Start Category -->
           <div class="container">
               <div class="row">
                   <p class="text-center fs-4">Category</p>
                   <div class="col-md-2" th:each="p : ${category}">
                       <div class="card rounded-circle shadow-sm p-3 mb-5 bg-body-tertiary rounded">
                           <div class="card-body text-center">
                               <img th:src="@{'/img/category_img/' + ${p.image}}"
                                    alt="[[${p.name}]]"
                                    width="65%"
                                    height="140px"><br>
                               <a th:href="@{'/products?category='+${p.name}}" class="text-decoration-none">[[${p.name}]]</a>
                           </div>
                       </div>
                   </div>
               </div>
           </div>
