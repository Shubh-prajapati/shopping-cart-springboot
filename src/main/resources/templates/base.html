<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="Layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Ecom Store</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
          integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- ===== Start Nav Bar ===== -->
<nav class="navbar navbar-expand-lg bg-primary fixed-top navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/index}">
            <i class="fa-solid fa-cart-shopping"></i> Ecom Store
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <!-- ===== Left Section ===== -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <th:block  th:if="${user==null}">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/">
                            <i class="fa-solid fa-house"></i> Home
                        </a>
                    </li>
                </th:block>

                <th:block  th:unless="${user==null}">
                    <li class="nav-item" th:if="${user.role==ROLE_ADMIN}">
                        <a class="nav-link active" aria-current="page" href="/admin/">
                            <i class="fa-solid fa-house"></i> Home
                        </a>
                    </li>
                </th:block>

                <th:block  th:unless="${user==null}">
                    <li class="nav-item" th:if="${user.role==ROLE_USER}">
                        <a class="nav-link active" aria-current="page" href="/">
                            <i class="fa-solid fa-house"></i> Home
                        </a>
                    </li>
                </th:block>



                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/products}">Products</a>
                </li>

                <!-- ===== Category Dropdown ===== -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="categoryDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        Category
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="categoryDropdown">
                        <li><a class="dropdown-item" th:href="@{/products}">All</a></li>
                        <li th:each="c : ${categorys}">
                            <a class="dropdown-item" th:href="@{'/products?category=' + ${c.name}}"
                               th:text="${c.name}"></a>
                        </li>
                    </ul>
                </li>
            </ul>

            <!-- ===== Right Section (User/Auth) ===== -->
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

                <!-- When user not logged in -->
                <th:block th:if="${user == null}">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/signin}">
                            <i class="fa-solid fa-right-to-bracket"></i> Login
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/register}">Register</a>
                    </li>
                </th:block>

                <!-- When user logged in -->
                <th:block th:if="${user != null}">
                    <th:block th:if="${user.role == 'ROLE_USER'}">
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/user/cart}">
                                <i class="fa-solid fa-cart-shopping"></i>
                                Cart [ [[${countCart}]] ]
                            </a>
                        </li>
                    </th:block>

                    <!-- Profile Dropdown -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" id="userDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fa-solid fa-user"></i> [[${user.name}]]
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="userDropdown">
                            <li th:if="${user.role=='ROLE_USER'}"><a
                                    class="dropdown-item" th:href="@{/user/profile}">Profile</a></li>

                            <li th:if="${user.role=='ROLE_ADMIN'}"><a
                                    class="dropdown-item" th:href="@{/admin/profile}">Profile</a></li>

                            <li th:if="${user.role=='ROLE_USER'}"><a class="dropdown-item" th:href="@{/user/user-orders}">My Orders</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" th:href="@{/logout}">Logout</a></li>
                        </ul>
                    </li>
                </th:block>
            </ul>
        </div>
    </div>
</nav>
<!-- ===== End Nav Bar ===== -->


<!--  JQuery Validation Library-->

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.js"></script>
<script type="text/javascript" src="js/script.js"></script>

<!-- ===== Page Content ===== -->
<div th:replace="${content}"></div>

<!-- ===== Footer ===== -->
<footer class="container-fluid p-2 bg-primary text-center text-white" style="margin-top: 120px;">
    <p class="mb-0">© 2025 Ecom Store | All Rights Reserved</p>
</footer>

<!-- ===== Bootstrap JS ===== -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
